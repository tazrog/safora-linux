<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- USB Burner: a USB stick taking in a disc image (down arrow) on the Safora purple tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a6e"/><stop offset="1" stop-color="#241a3a"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff0ea"/><stop offset="1" stop-color="#2bb8c4"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ece8f5"/><stop offset="1" stop-color="#c9c1dc"/></linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#tile)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="27.5" fill="none" stroke="#ece8f5" stroke-opacity="0.18"/>
  <!-- disc image -->
  <circle cx="38" cy="42" r="21" fill="url(#cy)"/>
  <circle cx="38" cy="42" r="14" fill="none" stroke="#241a3a" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="38" cy="42" r="5.5" fill="#241a3a"/>
  <path d="M26 31 A16 16 0 0 1 46 27" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <!-- written onto the stick -->
  <path d="M57 30 C70 20 84 22 86 34" fill="none" stroke="#ffd27a" stroke-width="6" stroke-linecap="round"/>
  <path d="M78 33 L94 33 L86 44 Z" fill="#ffd27a" stroke="#ffd27a" stroke-width="3" stroke-linejoin="round"/>
  <!-- USB stick -->
  <rect x="73" y="48" width="26" height="16" rx="2" fill="#9a90b3"/>
  <rect x="78" y="52" width="6" height="5" fill="#3a2f52"/>
  <rect x="88" y="52" width="6" height="5" fill="#3a2f52"/>
  <rect x="66" y="62" width="40" height="50" rx="9" fill="url(#body)"/>
  <path d="M66 92 H106 V103 A9 9 0 0 1 97 112 H75 A9 9 0 0 1 66 103 Z" fill="#7ff0ea"/>
  <circle cx="86" cy="77" r="4" fill="#2bb8c4"/>
  <!-- spark: burning -->
  <path d="M30 86 L36 76 L35 84 L42 82 L35 96 L36 88 Z" fill="#ffd27a"/>
</svg>
