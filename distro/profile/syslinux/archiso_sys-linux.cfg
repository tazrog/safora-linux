LABEL safora
TEXT HELP
Start the Safora Linux live system. From there you can install Safora to a disk.
ENDTEXT
MENU LABEL Safora Linux live installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% init_on_alloc=0 init_on_free=0 %KERNEL_PARAMS%
