[main]
font=Roboto:size=14
terminal=alacritty -e
# Bigger launcher: wider, more rows, more breathing room.
width=50
lines=18
horizontal-pad=24
vertical-pad=16
inner-pad=10
# fuzzel has no scrollbar; the counter (e.g. "24/87") beside the prompt shows how long the list is.
match-counter=yes

[colors]
background=161925f2
text=c0caf5ff
match=7aa2f7ff
selection=2a2e3dff
selection-text=c0caf5ff
counter=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=12
