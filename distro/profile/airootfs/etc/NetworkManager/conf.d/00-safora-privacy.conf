# Random MAC addresses on every network, and while scanning.
[device]
wifi.scan-rand-mac-address=yes
wifi.backend=wpa_supplicant

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
ipv6.ip6-privacy=2
connection.stable-id=${CONNECTION}/${BOOT}

[main]
dns=systemd-resolved

# No connectivity checks: NetworkManager must not contact a server on its own to see whether the internet works.
[connectivity]
enabled=false
