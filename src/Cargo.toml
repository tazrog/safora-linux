[workspace]
resolver = "2"
members = ["crates/safora-common", "crates/saforawm", "crates/safora-bar", "crates/safora-settings", "crates/safora-installer", "crates/safora-panels", "crates/safora-lock"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
safora-common = { path = "crates/safora-common" }
safora-panels = { path = "crates/safora-panels" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
