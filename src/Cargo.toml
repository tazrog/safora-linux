[workspace]
resolver = "2"
members = ["crates/sekuro-common", "crates/sekurowm", "crates/sekuro-bar", "crates/sekuro-settings", "crates/sekuro-installer", "crates/sekuro-panels", "crates/sekuro-lock"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sekuro-common = { path = "crates/sekuro-common" }
sekuro-panels = { path = "crates/sekuro-panels" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
