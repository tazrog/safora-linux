[workspace]
resolver = "2"
members = ["crates/steady-common", "crates/steadywm", "crates/steady-bar", "crates/steady-settings", "crates/steady-installer", "crates/steady-panels", "crates/steady-lock"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
steady-common = { path = "crates/steady-common" }
steady-panels = { path = "crates/steady-panels" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
